services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      TRADING_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/trading
      TRADING_DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@db:5432/trading
      TRADING_REDIS_URL: redis://redis:6379/0
      TRADING_SECRET_KEY: ${TRADING_SECRET_KEY:-change-me-in-production}
      TRADING_ANTHROPIC_API_KEY: ${TRADING_ANTHROPIC_API_KEY:-}
    depends_on:
      - db
      - redis

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.daily_scan worker -B --loglevel=info
    environment:
      TRADING_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/trading
      TRADING_DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@db:5432/trading
      TRADING_REDIS_URL: redis://redis:6379/0
      TRADING_ANTHROPIC_API_KEY: ${TRADING_ANTHROPIC_API_KEY:-}
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend

volumes:
  pgdata:
